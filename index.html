<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Banana</title>
    <link rel="icon" href="favicon.png" type="image/png">
    <style>
        /* 레트로 감성 폰트 및 전체 스타일 초기화 */
        body {
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #fffdf0; /* 부드러운 바나나 우유빛 배경 */
            color: #2c2c2c;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* 헤더 섹션 */
        header {
            text-align: center;
            padding: 50px 20px 30px;
        }

        .logo-area {
            width: 80px;
            height: 80px;
            margin: 0 auto 15px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo-area img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        header h1 {
            font-size: 32px;
            margin: 0 0 10px 0;
            color: #f7b11d; /* 바나나 포인트 컬러 */
            text-shadow: 2px 2px 0px #2c2c2c;
            letter-spacing: -1px;
        }

        header p {
            font-size: 16px;
            color: #666;
            margin: 0;
        }

        /* 팀원 카드 컨테이너 */
        .team-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
            max-width: 1000px;
            width: 90%;
            padding-bottom: 60px;
        }

        /* 팀원 카드 스타일 */
        .member-card {
            background: #ffffff;
            border: 3px solid #2c2c2c; /* 픽셀 느낌을 주는 두꺼운 아웃라인 */
            border-radius: 12px;
            box-shadow: 5px 5px 0px #2c2c2c; /* 레트로풍 그림자 */
            padding: 30px 20px;
            width: 240px;
            text-align: center;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        /* 카드 마우스 호버 효과 */
        .member-card:hover {
            transform: translate(-2px, -2px);
            box-shadow: 7px 7px 0px #f7b11d;
        }

        /* 카드 내 멤버 프로필 이미지 영역 */
        .member-img {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background-color: #fef8dc;
            border: 2px dashed #f7b11d;
            margin: 0 auto 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 36px;
        }

        .member-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        .member-name {
            font-size: 20px;
            font-weight: bold;
            margin: 0 0 5px 0;
            color: #2c2c2c;
        }

        .member-role {
            font-size: 14px;
            color: #f7b11d;
            font-weight: 600;
            margin: 0 0 15px 0;
            text-transform: uppercase;
        }

        .member-desc {
            font-size: 14px;
            line-height: 1.5;
            color: #555;
            margin: 0 0 20px 0;
            word-break: keep-all;
            min-height: 63px; /* 줄글 높이 밸런스 유지 */
        }

        /* SNS / 개인 링크 버튼 */
        .member-link {
            display: inline-block;
            padding: 8px 16px;
            background-color: #2c2c2c;
            color: #ffffff;
            text-decoration: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            transition: background-color 0.2s ease;
        }

        .member-link:hover {
            background-color: #f7b11d;
            color: #2c2c2c;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <img src="Banana_Pixel_Icon.png" alt="Banana Logo">
        </div>
        <h1>TEAM BANANA</h1>
        <p>상큼하고 단단한 결속력으로 흥미로운 프로젝트를 만드는 팀입니다.</p>
    </header>

    <div class="team-container">

        <div class="member-card">
            <div class="member-img">🍌</div>
            <div class="member-name">리더 바나나</div>
            <div class="member-role">Leader / Developer</div>
            <div class="member-desc">팀의 방향성을 잡고 메인 시스템을 설계합니다. 픽셀 아트를 좋아합니다.</div>
            <a href="https://github.com" target="_blank" class="member-link">GitHub</a>
        </div>

        <div class="member-card">
            <div class="member-img">🐒</div>
            <div class="member-name">몽키 개발자</div>
            <div class="member-role">Frontend Dev</div>
            <div class="member-desc">사용자가 마주하는 인터페이스를 다채롭고 쾌적하게 구현하는 역할을 맡고 있습니다.</div>
            <a href="https://github.com" target="_blank" class="member-link">GitHub</a>
        </div>

        <div class="member-card">
            <div class="member-img">🎨</div>
            <div class="member-name">그린 바나나</div>
            <div class="member-role">UI/UX Designer</div>
            <div class="member-desc">팀의 모든 비주얼 요소를 책임지며, 깔끔하고 직관적인 디자인 시스템을 설계합니다.</div>
            <a href="#" class="member-link">Portfolio</a>
        </div>

    </div>

</body>
</html>
